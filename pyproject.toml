[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-digest-userbot"
version = "2.0.2"
description = "A read-only Telegram channel scraper with an owner-only control bot. Collects messages into digest JSON with an embedded summary prompt, driven from Telegram."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["telegram", "telethon", "scraper", "digest", "telegram-bot", "read-only", "automation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Chat",
  "Topic :: Utilities",
  "Operating System :: OS Independent",
]
dependencies = [
  "telethon~=1.34",
  "python-dotenv~=1.0",
  "tqdm~=4.66",
  "qrcode~=7.4",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest~=8.0",
  "pytest-cov~=5.0",
  "hypothesis~=6.0",
  "jsonschema~=4.0",
  "ruff~=0.6",
  "mypy~=1.11",
  "bandit~=1.7",
  "pip-audit~=2.7",
]

[project.urls]
Homepage = "https://pavnxet.github.io/tg-digest-userbot/"
Repository = "https://github.com/pavnxet/tg-digest-userbot"
Documentation = "https://pavnxet.github.io/tg-digest-userbot/"

# Flat layout: every top-level module is shipped as-is (main.py / bot.py stay at
# the root, so `python main.py` and `python bot.py` keep working unchanged).
[tool.setuptools]
py-modules = [
  "bot",
  "bot_channels",
  "bot_files",
  "bot_handlers",
  "bot_health",
  "bot_prompts",
  "bot_run",
  "bot_schedule",
  "bot_settings",
  "channel_store",
  "channels",
  "client",
  "config",
  "files_store",
  "formatter",
  "logging_setup",
  "login_state",
  "main",
  "owner",
  "prompts",
  "run_args",
  "run_manager",
  "schedule_store",
  "scraper",
  "settings_store",
  "splitter",
  "state",
  "timeutil",
  "user_session",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".git", ".venv", "output", ".cache", "logs", "docs"]

[tool.ruff.lint]
# The same rule set the codebase is already clean against.
select = ["F", "E9", "B", "SIM", "BLE", "A", "RUF"]
ignore = ["RUF001"]  # ambiguous unicode: the UI text is intentionally Hindi

[tool.ruff.lint.per-file-ignores]
# Tests stay linted for real errors (F, E9) but skip the style rules that fight
# the idiomatic `app, bot, user, owners, session = build_app(...)` unpacking.
"tests/*" = ["RUF059", "RUF005", "RUF015", "RUF013", "SIM105", "BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["perf: slow performance test (deselect with -m 'not perf')"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["*.py"]
